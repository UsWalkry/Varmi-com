name: Build & Deploy Flutter Web to cPanel

on:
  push:
    branches: [main]
    paths:
      - "varmi_flutter/**"
      - ".github/workflows/deploy-flutter-web.yml"
  workflow_dispatch:
    # Manuel tetikleme için

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        working-directory: ./varmi_flutter
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: ./varmi_flutter
        run: |
          flutter build web \
            --release \
            --base-href /mobil/ \
            --dart-define=PRODUCTION=true \
            --web-renderer canvaskit

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          port: ${{ secrets.FTP_PORT || 21 }}
          local-dir: varmi_flutter/build/web/
          server-dir: /public_html/mobil/
          # Sadece mobil/ klasörüne yazılır, site bozulmaz
          danger-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
